name: Sync Live Matches & Odds

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Live Sync
        run: |
          curl -sS -X POST "${{ secrets.API_BASE_URL }}/admin/sync/live" \
            -H "X-API-Key: ${{ secrets.ADMIN_API_KEY }}" \
            -H "Content-Type: application/json"
